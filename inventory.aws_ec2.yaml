plugin: amazon.aws.aws_ec2
regions:
- us-east-1
keyed_group:
  # add hosts to tag_Name_value groups for each aws_ec2 host's tags.Name variable.
- key: tags.Name
  prefix: "dynamic_"
  separator: ""
filters:
# This selects only running instances with tag `Environment` tag set to `dev`.
  tag:Name: frontend
  instance-state-name: running
hostnames:
  # This option allows displaying the public ip also private addresses too.
  - private-ip-address
compose:
  # This sets the ansible_host variable to connect with the private IP address without changing the hostname.
  ansible_hosts: private_ip_address
